services:
  mom-qwen:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: cloudcore-ai-mom-qwen
    restart: unless-stopped
    ports:
      - 127.0.0.1:8000:8080
    volumes:
      - /opt/ai-stack/models/mom:/models:ro
    command:
      - -m
      - /models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      - -c
      - '8192'
      - -np
      - '1'
      - --cache-reuse
      - '256'
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - -t
      - '12'
      - -tb
      - '16'
      - --prio
      - '2'
      - --prio-batch
      - '2'
      - -fa
      - 'on'
      - -cb
      - --alias
      - qwen2.5-7b
